{% extends "base.html" %}
{% block title %}404 — 页面未找到{% endblock %}
{% block page_title %}页面未找到{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-card">
    <div class="error-code">404</div>
    <h2 class="error-title">页面未找到</h2>
    <p class="error-desc">抱歉，你访问的页面不存在或已被移除。</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">返回首页</a>
  </div>
</div>
<style>
.error-page { display: flex; align-items: center; justify-content: center; min-height: 60vh; padding: 40px 16px; }
.error-card { text-align: center; max-width: 480px; }
.error-code { font-size: 96px; font-weight: 800; line-height: 1; color: #4f46e5; opacity: 0.18; letter-spacing: -0.04em; margin-bottom: 12px; }
.error-title { font-size: 22px; font-weight: 600; color: #1f2937; margin-bottom: 12px; }
.error-desc { color: #6b7280; margin-bottom: 28px; }
</style>
{% endblock %}
