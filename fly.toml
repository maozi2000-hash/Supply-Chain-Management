app = "supply-chain-mgmt"
primary_region = "nrt"

[build]
  builder = "paketobuildpacks/builder:base"

[processes]
  web = "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --log-level info"

[env]
  FLASK_DEBUG = "false"
  PYTHONUNBUFFERED = "1"
  PORT = "8080"

[mounts]
  source = "uploads_data"
  destination = "/app/uploads"

[vm]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = false
  auto_start_machines = true

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/"
    protocol = "http"
